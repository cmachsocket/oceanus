name: Android Build

# Reusable workflow: invoked by .github/workflows/release.yml.
#
# Inputs:
#   ref  : tag/branch/SHA to checkout (e.g. github.ref from caller)
#
# Output:
#   Uploads release-artifacts/ as a workflow artifact named
#   "release-artifacts-android" so the calling workflow's publish job
#   can download all 4 platforms via the same name.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ------------------------------------------------------------
      # Java / Android SDK
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        # v3 + cmdline-tools 11076708 默认跑 `sdkmanager tools`,但该
        # 镜像里 tools 包已被 deprecate,报 `Failed to find package 'tools'`。
        # v4 同样支持 `packages:` 控制,Flutter Android build 不需要老
        # tools 包(platform-tools 自带 adb/aapt/zipalign),把 packages
        # 置空跳过默认安装。cmdline-tools 14742923 (20.0) 是当前推荐。
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      # ------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-flutter-3.47.4-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-ubuntu-flutter-3.47.4-
            pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ubuntu-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ubuntu-

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Android Gradle wrapper
      # ------------------------------------------------------------
      - name: Ensure gradlew is executable
        run: |
          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing."
            echo "Commit android/gradlew, android/gradlew.bat and"
            echo "android/gradle/wrapper/gradle-wrapper.jar to the app repository."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Write local.properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Debug dependencies
        shell: bash
        run: |
          echo "=== pubspec.yaml ==="
          grep -n -A8 -B2 "ncm_api_enhanced" pubspec.yaml || true

          echo
          echo "=== pubspec.lock ==="
          grep -n -A5 -B2 "ncm_api_enhanced" pubspec.lock || true

          echo
          echo "=== Files ==="
          find . -maxdepth 3 -iname '*ncm*' -print
      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --split-per-abi \
            --no-tree-shake-icons

      # ------------------------------------------------------------
      # Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        run: |
          APK="build/app/outputs/apk/release/app-arm64-v8a-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            echo "Actual files:"
            find build/app/outputs/apk/release \
              -maxdepth 2 \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

      # ------------------------------------------------------------
      # Prepare artifacts
      # ------------------------------------------------------------
      - name: Prepare artifacts
        run: |
          APK="build/app/outputs/apk/release/app-arm64-v8a-release.apk"

          mkdir -p release-artifacts

          cp "$APK" release-artifacts/

          cd release-artifacts

          sha256sum *.apk > SHA256SUMS

          echo
          echo "=== release artifacts ==="
          ls -lh

          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # Upload as workflow artifact. Name is platform-scoped (no tag
      # suffix) because all 4 build jobs in the calling workflow share
      # the same workflow run — caller downloads by name.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-android
          path: release-artifacts/
          retention-days: 7
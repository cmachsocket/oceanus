name: macOS Build

# Reusable workflow: invoked by .github/workflows/release.yml.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ARM64 bundle
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # ------------------------------------------------------------
      # Xcode
      # ------------------------------------------------------------
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "=== Xcode ==="
          xcodebuild -version
          xcode-select -p

          echo
          echo "=== macOS SDK ==="
          xcrun --sdk macosx --show-sdk-version

          echo
          echo "=== macOS ==="
          sw_vers

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      - name: Show critical dependencies
        run: |
          echo "=== Flutter ==="
          flutter --version

          echo
          echo "=== connectivity_plus ==="
          grep -A 3 -B 1 "connectivity_plus:" pubspec.lock || true

      # ------------------------------------------------------------
      # Enable macOS desktop
      # ------------------------------------------------------------
      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop
          flutter devices

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build release bundle
        run: |
          flutter build macos \
            --release \
            --no-tree-shake-icons

      # ------------------------------------------------------------
      # Verify
      # ------------------------------------------------------------
      - name: Verify application
        run: |
          APP="build/macos/Build/Products/Release/oceanus.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Application missing at $APP"
            echo "Actual build output:"
            find build/macos -maxdepth 5 -type d -print 2>/dev/null || true
            exit 1
          fi

          echo "=== Application ==="
          ls -lh "$APP"

          echo
          echo "=== Contents ==="
          find "$APP/Contents" -maxdepth 2 -type f -print | head -100

          echo
          echo "=== Architecture ==="
          file "$APP/Contents/MacOS/oceanus"

          echo
          echo "=== Dependencies ==="
          otool -L "$APP/Contents/MacOS/oceanus" || true

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package artifact
        run: |
          APP="build/macos/Build/Products/Release/oceanus.app"
          STAGE="release-artifacts/oceanus-macos-arm64"

          rm -rf release-artifacts
          mkdir -p "$STAGE"

          cp -R "$APP" "$STAGE/"

          cd release-artifacts

          tar -czf oceanus-macos-arm64.tar.gz \
            oceanus-macos-arm64

          shasum -a 256 *.tar.gz > SHA256SUMS

          echo
          echo "=== Release artifacts ==="
          ls -lh

          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # Upload as workflow artifact. Platform-scoped name (no tag suffix)
      # because all 4 build jobs in the calling workflow share the same
      # workflow run — caller downloads by name.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos
          path: release-artifacts/
          retention-days: 7
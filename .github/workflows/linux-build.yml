name: Linux Build

# Reusable workflow: invoked by .github/workflows/release.yml.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x64 bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------
      # ncm_api_enhanced 在 desktop 是 pure Dart (调系统 node), 所以这里
      # 不需要 Android 那套 JDK / Android SDK / NDK。
      # CMake + GTK + pkg-config 是 Flutter Linux build 的硬依赖;
      # media_kit 的 mpv 后端由 pubspec 里的 media_kit_libs_linux 提供
      # 预编译 .so, 不需要系统 libmpv-dev。
      # node 是 ncm_api_enhanced desktop bridge 启动时 Process.spawn 用的。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            g++ \
            pkg-config \
            libgtk-3-dev \
            dpkg-dev \
            nodejs \
            ninja-build

      - name: Setup Node.js 22 (matches ncm_api_enhanced upstream)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ubuntu-flutter-3.47.4-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-ubuntu-flutter-3.47.4-
            pub-

      - name: Cache CMake / Flutter Linux artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake
            build
          key: cmake-ubuntu-linux-x64-${{ hashFiles('**/CMakeLists.txt', '**/linux/CMakeLists.txt') }}
          restore-keys: |
            cmake-ubuntu-linux-x64-

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      # flutter build linux 默认输出到 build/linux/x64/release/bundle/,
      # 含可执行文件 + lib/*.so + data/flutter_assets/ + icudtl.dat。
      # 把整个 bundle 目录打包成 tar.gz 给用户直接解压就能跑。
      - name: Build release bundle
        run: |
          flutter build linux \
            --release \
            --target-platform=linux-x64

      # ------------------------------------------------------------
      # Verify bundle
      # ------------------------------------------------------------
      - name: Verify bundle
        run: |
          BUNDLE="build/linux/x64/release/bundle"

          if [ ! -d "$BUNDLE" ]; then
            echo "::error::bundle missing at $BUNDLE"
            echo "Actual contents:"
            find build/linux -maxdepth 4 -type d -print 2>/dev/null || true
            exit 1
          fi
          echo "=== Bundle top-level ==="
          ls -lh "$BUNDLE"

          echo
          echo "=== Bundle libraries ==="
          ls -lh "$BUNDLE/lib" || true

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package artifact
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          STAGE="release-artifacts/oceanus-linux-x64"
          DEB_ROOT="release-artifacts/deb-root"
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"

          rm -rf release-artifacts
          mkdir -p release-artifacts
          mkdir -p "$STAGE"
          cp -r "$BUNDLE"/. "$STAGE"/

          # Build a conventional Debian package alongside the portable bundle.
          mkdir -p \
            "$DEB_ROOT/DEBIAN" \
            "$DEB_ROOT/opt/oceanus" \
            "$DEB_ROOT/usr/bin" \
            "$DEB_ROOT/usr/share/applications" \
            "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE"/. "$DEB_ROOT/opt/oceanus/"
          ln -s /opt/oceanus/oceanus "$DEB_ROOT/usr/bin/oceanus"
          cp assets/oceanus.png \
            "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/oceanus.png"

          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: oceanus
          Version: ${APP_VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Oceanus contributors
          Depends: libgtk-3-0, libstdc++6, libmpv2, nodejs
          Description: Flutter 网易云音乐客户端
           Oceanus desktop client for NetEase Cloud Music.
          EOF

          cat > "$DEB_ROOT/usr/share/applications/oceanus.desktop" <<'EOF'
          [Desktop Entry]
          Name=Oceanus
          Comment=NetEase Cloud Music client
          Exec=/usr/bin/oceanus
          Icon=oceanus
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          StartupWMClass=oceanus
          EOF

          dpkg-deb --build --root-owner-group \
            "$DEB_ROOT" "release-artifacts/oceanus_${APP_VERSION}_amd64.deb"
          rm -rf "$DEB_ROOT"

          cd release-artifacts
          tar -czf oceanus-linux-x64.tar.gz \
            oceanus-linux-x64

          sha256sum *.tar.gz *.deb > SHA256SUMS

          echo
          echo "=== release artifacts ==="
          ls -lh

          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # Upload as workflow artifact. Platform-scoped name (no tag suffix)
      # because all 4 build jobs in the calling workflow share the same
      # workflow run — caller downloads by name.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: release-artifacts/
          retention-days: 7
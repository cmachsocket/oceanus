name: Windows Build

# Reusable workflow: invoked by .github/workflows/release.yml.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 bundle
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------
      # ncm_api_enhanced 在 Windows desktop 是 pure Dart (调系统 node),
      # 不需要 Android 那套 JDK / Android SDK / NDK, 也不需要额外 native
      # build 工具 (flutter build windows 自己带 MSVC, GitHub Actions
      # windows-latest runner 已经预装)。
      # node 是 ncm_api_enhanced desktop bridge 启动时 Process.spawn 用的。
      - name: Setup Node.js 22 (matches ncm_api_enhanced upstream)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ------------------------------------------------------------
      # Cache
      # ------------------------------------------------------------
      - name: Cache Pub
        uses: actions/cache@v4
        # Windows 路径用 ~ 展开到 C:\Users\RUNNER~1\AppData\Roaming\Pub\Cache
        # 但 actions/cache 在 windows 上能识别 ~ 路径; 也可写环境变量。
        # 用 RUNNER_USERPROFILE 显式展开, 避免路径转义问题。
        env:
          PUB_CACHE: ${{ runner.workspace }}\.pub-cache
        with:
          path: ${{ runner.workspace }}\.pub-cache
          key: pub-windows-flutter-3.47.4-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-windows-flutter-3.47.4-
            pub-

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Flutter pub get
        env:
          PUB_CACHE: ${{ runner.workspace }}\.pub-cache
        run: flutter pub get

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      # flutter build windows 默认输出到 build/windows/x64/runner/Release/,
      # 含 .exe + .dll + data/flutter_assets/ + icudtl.dat。但 runner 是
      # 多 config 构建目录, 完整 bundle 还要看 flutter tool 怎么布置;
      # 用 --target-platform=windows-x64 显式指定平台, 输出到 build/windows/
      # 顶层。把整个 Release/ 目录打包成 zip。
      - name: Build release bundle
        shell: pwsh
        run: |
          flutter build windows --release

          Write-Host ""
          Write-Host "=== build/windows layout ==="
          if (Test-Path "build/windows") {
            Get-ChildItem -Recurse -Depth 4 build/windows |
              Where-Object { $_.PSIsContainer } |
              ForEach-Object { Write-Host $_.FullName }
          }

      # ------------------------------------------------------------
      # Verify bundle
      # ------------------------------------------------------------
      - name: Verify bundle
        shell: pwsh
        run: |
          $bundle = "build\windows\x64\runner\Release"

          if (-not (Test-Path $bundle)) {
            Write-Error "bundle missing at $bundle"
            Get-ChildItem -Recurse build\windows -ErrorAction SilentlyContinue |
              Where-Object { $_.PSIsContainer } |
              ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          Write-Host "=== Bundle top-level ==="
          Get-ChildItem -Force $bundle | Format-Table Name, Length

          Write-Host ""
          Write-Host "=== Bundle .exe ==="
          $exe = Get-ChildItem -Path $bundle -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "no .exe found in $bundle"
            exit 1
          }
          Write-Host "exe: $($exe.Name)"

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package artifact
        shell: pwsh
        run: |
          $bundle = "build\windows\x64\runner\Release"
          $stage  = "release-artifacts\oceanus-windows-x64"

          if (Test-Path release-artifacts) {
            Remove-Item release-artifacts -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # Copy-Item -Recurse 保留文件 + 目录结构
          Copy-Item -Path (Join-Path $bundle "*") -Destination $stage -Recurse -Force

          # 用 7z / Compress-Archive 打包 zip; GitHub Actions windows-latest
          # 自带 7z, Compress-Archive 也行。Compress-Archive 默认 .zip,
          # 跨平台解压稳。
          Compress-Archive -Path $stage `
            -DestinationPath "release-artifacts\oceanus-windows-x64.zip" `
            -CompressionLevel Optimal -Force

          Get-ChildItem release-artifacts | Format-Table Name, Length

          Write-Host ""
          Write-Host "=== SHA256SUMS ==="
          $sums = @()
          foreach ($f in Get-ChildItem release-artifacts -Filter "*.zip") {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $line = "$h  $($f.Name)"
            $sums += $line
            Write-Host $line
          }
          $sums | Out-File "release-artifacts\SHA256SUMS" -Encoding ascii -NoNewline:$false

      # Upload as workflow artifact. Platform-scoped name (no tag suffix)
      # because all 4 build jobs in the calling workflow share the same
      # workflow run — caller downloads by name.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: release-artifacts/
          retention-days: 7
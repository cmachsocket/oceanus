name: oceanus
version: 1.3.2
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-oceanus: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.oceanus # adjust accordingly to your app name

apps:
  oceanus:
    command: oceanus
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-oceanus
parts:
  oceanus:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application

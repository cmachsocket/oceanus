android.builder.sdkDownload=false
# Gradle daemon JVM heap —— GitHub-hosted runner 默认 512MB,
# 跟 :musiclibrary (NDK + libcurl prefab) + 6 个第三方 plugin 一起 dex merge 会爆
# (D8 OutOfMemoryError: Java heap space, 2026-08-22 CI 复现)。
# 2G 不够, mergeExtDexDebug 仍然爆 heap. 4G 应该够。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/gradle-heap.hprof
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false